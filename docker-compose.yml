services:
  postgres:
    image: postgres:15-alpine
    container_name: food-app-demo-postgres-1
    environment:
      POSTGRES_DB: parabdi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/parabdi
      JWT_SECRET: ${JWT_SECRET:-parabdi-prod-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-parabdi-refresh-secret}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:3000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
