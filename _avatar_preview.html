<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { background:#111; color:#eee; font-family:sans-serif; margin:24px; }
  h2 { font-size:16px; margin:18px 0 8px; }
  .row { display:flex; gap:16px; }
  .cell { text-align:center; }
  .cell img { width:160px; height:160px; border-radius:50%; display:block; }
  .cell small { display:block; margin-top:6px; color:#aaa; }
  .small img { width:56px; height:56px; }
  .row.small { gap:24px; align-items:center; margin-top:10px; }
</style>
</head>
<body>
<h2>Men</h2>
<div class="row">
  <div class="cell"><img src="assets/images/avatar_male_1.svg"><small>male_1</small></div>
  <div class="cell"><img src="assets/images/avatar_male_2.svg"><small>male_2</small></div>
  <div class="cell"><img src="assets/images/avatar_male_3.svg"><small>male_3</small></div>
  <div class="cell"><img src="assets/images/avatar_male_4.svg"><small>male_4</small></div>
  <div class="cell"><img src="assets/images/avatar_male_5.svg"><small>male_5</small></div>
</div>
<h2>Women</h2>
<div class="row">
  <div class="cell"><img src="assets/images/avatar_female_1.svg"><small>female_1</small></div>
  <div class="cell"><img src="assets/images/avatar_female_2.svg"><small>female_2</small></div>
  <div class="cell"><img src="assets/images/avatar_female_3.svg"><small>female_3</small></div>
  <div class="cell"><img src="assets/images/avatar_female_4.svg"><small>female_4</small></div>
  <div class="cell"><img src="assets/images/avatar_female_5.svg"><small>female_5</small></div>
</div>
<h2>Small size (48px, like home header)</h2>
<div class="row small">
  <img src="assets/images/avatar_male_1.svg">
  <img src="assets/images/avatar_male_2.svg">
  <img src="assets/images/avatar_male_3.svg">
  <img src="assets/images/avatar_male_4.svg">
  <img src="assets/images/avatar_male_5.svg">
  <img src="assets/images/avatar_female_1.svg">
  <img src="assets/images/avatar_female_2.svg">
  <img src="assets/images/avatar_female_3.svg">
  <img src="assets/images/avatar_female_4.svg">
  <img src="assets/images/avatar_female_5.svg">
</div>
</body>
</html>
